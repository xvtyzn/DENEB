name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds, then fails if the viewer entry has picked up the presets, the
      # linter, the diff, the importers or AbML. The boundary is the reason the
      # core stays small, so it is checked rather than promised.
      - run: npm run size

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Every subpath must resolve from a consumer under NodeNext + strict.
      - run: node scripts/check-exports.mjs
